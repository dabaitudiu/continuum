[project]
name = "continuum-gate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "google-adk>=1.0",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-pubsub>=2.31,<3",
  "opentelemetry-exporter-gcp-trace>=1.9,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "httpx2>=0.1",
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
